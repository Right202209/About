<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
  <link rel="alternate icon" href="%PUBLIC_URL%/favicon.ico" />
  <link rel="preload" as="image" href="%PUBLIC_URL%/macos26-desktop.jpg" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="theme-color" content="#354737" />
  <meta name="renderer" content="webkit" />
  <meta name="description" content="A macOS-style desktop that runs in the browser: menu bar, Dock, Finder, Spotlight, and draggable windows." />
  <title>macOS Desktop</title>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        registrations.forEach(function (registration) { registration.unregister() })
      })
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) { caches.delete(key) })
        })
      }
    }
  </script>
  <script>
    (function () {
      try {
        var key = 'about:theme'
        var saved = localStorage.getItem(key)
        var theme = (saved === 'light' || saved === 'dark')
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {}
    })()
  </script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>

</html>
